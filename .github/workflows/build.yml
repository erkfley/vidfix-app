name: Build APK

# Builds the VidFix APK on every push to main, on version tags, and manually.
# - Every push: APK attached to workflow artifacts
# - Tag push (v*): APK attached to a GitHub Release
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK platform 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/vidfix.keystore" \
            -alias vidfix -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vidfix123 -keypass vidfix123 \
            -dname "CN=VidFix, O=VidFix, C=ID"
          echo "VIDFIX_KEYSTORE_FILE=$RUNNER_TEMP/vidfix.keystore" >> "$GITHUB_ENV"
          echo "VIDFIX_KEYSTORE_PASS=vidfix123" >> "$GITHUB_ENV"
          echo "VIDFIX_KEY_ALIAS=vidfix" >> "$GITHUB_ENV"
          echo "VIDFIX_KEY_PASS=vidfix123" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/VidFix-v1.0.0.apk"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidFix-APK
          path: dist/VidFix-v1.0.0.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/VidFix-v1.0.0.apk \
            --title "VidFix $GITHUB_REF_NAME" \
            --generate-notes
